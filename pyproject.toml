[tool.poetry]
name = "autoortho4xplane"
version = "2.0.3"
description = "AutoOrtho project for X-plane, the project is a fork ."
authors = []
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "3.14.*"
flask = "^3.1.3"
flask-socketio = "^5.6.1"
geocoder = "^1.38.1"
packaging = "^26.3"
psutil = "^7.2.2"
pytest = "^9.1.1"
mfusepy = "^3.1.1"
requests = "^2.34.2"
httpx = {version = "^0.28.1", extras = ["http2"]}
msgpack = "^1.2.1"
pyzmq = "^27.1.0"
PySide6 = "^6.11.1"
numpy = "^2.5.2"
locust = "^2.46.3"
zstandard = "^0.25.0"

[tool.poetry.dev-dependencies]
pytest = "^9.1.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10.0"

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"
